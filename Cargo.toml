[package]
name = "osu-difficulty-lab"
version = "0.3.0"
edition = "2024"
description = "Versioned osu!standard and osu!mania difficulty datasets and similarity indexes"
license = "MIT"
repository = "https://github.com/osuplusplus/osu-difficulty-lab"

[lib]
name = "osu_difficulty_lab"
path = "src/lib.rs"

[[bin]]
name = "osu-difficulty-lab"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
arrow-array = "54.3.1"
arrow-schema = "54.3.1"
bincode = "1.3"
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
hnsw = { version = "0.11", features = ["serde1"] }
memmap2 = "0.9"
parquet = { version = "54.3.1", default-features = false, features = ["arrow", "snap"] }
rand_pcg = { version = "0.3", features = ["serde1"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "socks"] }
roaring = { version = "0.11", features = ["serde"] }
rosu-map = "0.2.1"
rosu-pp = { git = "https://github.com/Apeuriox/rosu-pp", branch = "pp-rework-202607" }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sevenz-rust = { version = "0.6.1", default-features = false }
sha2 = "0.10"
space = { version = "0.17", features = ["alloc", "serde"] }
thiserror = "2.0"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.15"
